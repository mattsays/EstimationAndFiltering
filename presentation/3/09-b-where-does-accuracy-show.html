<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Does it buy accuracy?</title>
<link rel="stylesheet" href="slideui.css">
<script src="slideui.js" defer></script>
<style>
.acc-slide{padding:22px 16px 8px}
.acc-slide h1{font-size:40px;margin:0 0 8px 18px}
.acc-slide .body{justify-content:flex-start;gap:4px}
.acc-slide .acc-panels{gap:2px;flex:1;min-height:0;align-items:center}
.acc-slide .acc-panels>svg{flex:1 1 0;width:50%;max-width:none!important;max-height:none;height:auto}
.acc-slide .acc-legend{font-size:21px;gap:30px;margin:0 0 4px}
.acc-slide .acc-legend i{width:28px;height:4px}
/* Build step: quantify the Velocity gap against the EKF baseline. */
.acc-delta{display:flex;align-items:center;justify-content:center;gap:22px;min-height:46px;
  margin:2px auto 0;padding:8px 24px;border:1px solid var(--cardline);border-radius:14px;
  background:var(--card);color:var(--muted);font-size:20px;line-height:1.2}
.acc-delta-label{font-weight:650;color:var(--fg)}
.acc-delta-value{display:inline-flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.acc-delta-value i{display:inline-block;width:22px;height:3px;border-radius:2px}
.acc-delta-value.ukf i{background:var(--accent)}
.acc-delta-value.ckf i{background:var(--accent2)}
.acc-delta-value b{font-size:23px;font-weight:750}
.acc-delta-value.ukf b{color:var(--accent)}
.acc-delta-value.ckf b{color:var(--accent2)}
</style>
</head>
<body>

<div class="slide-layout">

<section class="slide acc-slide build" data-steps="2">
